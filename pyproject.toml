[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ferrule"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["cryptography>=44"]

[project.scripts]
ferrule = "ferrule_cli.__main__:main"

[tool.setuptools]
packages = ["ferrule_artifact", "ferrule_cli"]
package-dir = {ferrule_artifact = "packages/artifact/python/ferrule_artifact", ferrule_cli = "cli/ferrule_cli"}
